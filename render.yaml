services:
  # Backend API Service
  - type: web
    name: emailonebox_project
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ELASTICSEARCH_URL
        value: http://localhost:9200
      - key: NODE_ENV
        value: production
      # Email accounts (configure in Render dashboard)
      - key: EMAIL1_USER
        sync: false
      - key: EMAIL1_PASSWORD
        sync: false
      - key: EMAIL1_HOST
        value: imap.gmail.com
      - key: EMAIL1_PORT
        value: 993
      - key: EMAIL2_USER
        sync: false
      - key: EMAIL2_PASSWORD
        sync: false
      - key: EMAIL2_HOST
        value: imap.gmail.com
      - key: EMAIL2_PORT
        value: 993
      # Optional integrations
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false